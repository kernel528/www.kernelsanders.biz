kind: pipeline
type: docker
name: website-rootless-validation

node:
  ci-role: rootless-image-smoke
  platform: linux-amd64

trigger:
  repo:
    - kernel528/www.kernelsanders.biz
  branch:
    - testing
    - main
  event:
    - pull_request
    - push
    - custom

steps:
  - name: lint-site
    image: node:22.23.4-alpine3.24
    commands:
      - npm ci
      - npm run lint

  - name: build-and-smoke
    image: docker:27-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_BUILDKIT: "0"
    commands:
      - scripts/ci-rootless-website-smoke.sh
    volumes:
      - name: podman-socket
        path: /var/run/docker.sock

volumes:
  - name: podman-socket
    host:
      path: /run/user/1001/podman/podman.sock

---

kind: pipeline
type: docker
name: website-testing-candidate

trigger:
  repo:
    - kernel528/www.kernelsanders.biz
  branch:
    - testing
  event:
    - push

services:
  - name: docker
    image: docker:27.5.1-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - name: candidate-dockersock
        path: /var/run

steps:
  - name: build-and-smoke-candidate
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      WEBSITE_IMAGE_REPO: kernel528/www.kernelsanders.biz
    volumes:
      - name: candidate-dockersock
        path: /var/run
    commands:
      - scripts/ci-build-website-candidate.sh

  - name: publish-candidate
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      WEBSITE_IMAGE_REPO: kernel528/www.kernelsanders.biz
      DOCKER_USERNAME:
        from_secret: docker_username
      DOCKER_PASSWORD:
        from_secret: docker_password
    volumes:
      - name: candidate-dockersock
        path: /var/run
    commands:
      - scripts/ci-publish-website-candidate.sh

  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts

volumes:
  - name: candidate-dockersock
    temp: {}

---

kind: pipeline
type: docker
name: main-website

trigger:
  repo:
    - kernel528/www.kernelsanders.biz
  branch:
    - main
  event:
    - push

steps:
  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts

---

kind: pipeline
type: docker
name: website-immutable-release

# Release tags are manually created from reviewed main commits.
trigger:
  repo:
    - kernel528/www.kernelsanders.biz
  event:
    - tag

services:
  - name: docker
    image: docker:27.5.1-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - name: release-dockersock
        path: /var/run

steps:
  - name: build-and-smoke-release
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      WEBSITE_IMAGE_REPO: kernel528/www.kernelsanders.biz
    volumes:
      - name: release-dockersock
        path: /var/run
    commands:
      - scripts/ci-build-website-release.sh

  - name: check-immutable-tag-unused
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      WEBSITE_IMAGE_REPO: kernel528/www.kernelsanders.biz
    volumes:
      - name: release-dockersock
        path: /var/run
    commands:
      - scripts/ci-check-website-release-tag-unused.sh

  - name: publish-immutable-release
    image: docker:27.5.1-cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      WEBSITE_IMAGE_REPO: kernel528/www.kernelsanders.biz
      DOCKER_USERNAME:
        from_secret: docker_username
      DOCKER_PASSWORD:
        from_secret: docker_password
    volumes:
      - name: release-dockersock
        path: /var/run
    commands:
      - scripts/ci-publish-website-release.sh

  - name: slack-notification
    image: plugins/slack
    when:
      status:
        - failure
        - success
    settings:
      webhook:
        from_secret: slack_webhook_drone_alerts

volumes:
  - name: release-dockersock
    temp: {}
